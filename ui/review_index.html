.context{display:none}.evidence-card{border:1px solid #d8e2e9;border-radius:7px;background:#fff;padding:11px;margin:9px 0}.evidence-card blockquote{margin:8px 0;padding:8px 10px;border-left:3px solid #2781b5;background:#f4f9fc;white-space:pre-wrap;line-height:1.5}.evidence-card p{margin:7px 0;line-height:1.5}.evidence-card .where{font-size:.83rem;color:#526a7b;overflow-wrap:anywhere}.evidence-card .why{font-size:.9rem}.evidence-card .label{font-weight:700;color:#23475e}@media(max-width:1050px){main,body.list-collapsed main{height:auto;grid-template-columns:1fr 260px}aside{grid-column:1/-1;max-height:170px}body.list-collapsed aside{height:45px}#evidence-pane{min-height:70vh}.vote-pane{min-height:70vh}}@media(max-width:700px){main,body.list-collapsed main{grid-template-columns:1fr}aside,#evidence-pane,.vote-pane{grid-column:1}.vote-pane{min-height:0}}

<header><h1>항목명 정답지 검수 · 원본 뷰어</h1><p>검수 대상 항목명이 원본 자료의 해당 사업과 일치하는지 확인</p></header>
<main><aside><div class="pane-head"><h2>항목 목록</h2><strong id="progress">불러오는 중</strong><button id="toggle-list" aria-label="목록 접기" title="목록 접기">☰</button></div><div class="list-controls"><select id="filter" aria-label="목록 범위"><option value="search">검색</option><option value="priority" selected>우선 검토</option><option value="auto_needed">검토 필요 · 우선 검토 중</option><option value="auto_correct">자동 맞음</option><option value="saved">저장한 행 · 최근순</option><option value="pending">미판정</option><option value="all">전체 397행</option><option value="wrong">상이</option><option value="undecidable">판단불가</option><option value="correct">맞음</option></select><input id="list-search" type="search" hidden aria-label="목록 검색" placeholder="항목명·부처·행 번호" title="전체 사업에서 검색 · 여러 행: 21,123" autocomplete="off"><small id="list-search-count" aria-live="polite"></small></div><div id="list"></div></aside>
<article id="evidence-pane"><h2 id="title">검수 행을 불러오는 중</h2><div id="badges"></div><div id="review-fixed"><div class="target"><div id="excel" class="text"></div><button id="agency" class="muted" type="button" title="데이터셋의 그룹"></button><div id="reference-fields" style="display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:6px;font-size:.95rem"></div></div>
<div class="preview-head"><h3>원본 이미지 화면 <span id="viewer-mode" class="badge">이미지 페이지 뷰어</span></h3><div class="preview-controls" id="native-controls" hidden><button id="native-prev-hit" title="항목명이 있는 이전 페이지">◀ 항목명</button><span id="native-page-label">준비 중</span><button id="native-next-hit" title="항목명이 있는 다음 페이지">항목명 ▶</button></div><div class="preview-controls" id="pdf-controls"><button id="prev-hit" title="항목명이 있는 이전 페이지">◀ 항목명</button><button id="prev-page" title="바로 이전 페이지">◀ 페이지</button><span id="page-label">준비 중</span><button id="next-page" title="바로 다음 페이지">페이지 ▶</button><button id="next-hit" title="항목명이 있는 다음 페이지">항목명 ▶</button></div></div><div id="native-search" hidden><label for="native-search-input">원문 찾기</label><input id="native-search-input" type="search" placeholder="원문에서 찾을 말" autocomplete="off"><button id="native-search-prev" title="이전 검색 결과">↑</button><button id="native-search-next" title="다음 검색 결과">↓</button><span id="native-search-count" role="status">Ctrl+F로 검색</span></div></div><div id="preview-message" class="muted"></div><div class="preview-viewport"><div id="native-page" tabindex="0" aria-label="원본 문서" hidden></div><img id="source-image" alt="원본 자료 페이지" hidden></div><div id="object-panel" hidden></div><p id="viewer-error" class="error" hidden></p>

  </article>
<section class="vote-pane"><div class="pane-head"><h2>판정</h2></div><div class="vote-body"><p class="muted">검수 대상 이름이 원본의 같은 항목·범위을 가리키나?</p><fieldset><legend class="muted">원본을 기준으로 선택해 줘</legend><label class="choice"><input type="radio" name="choice" value="correct"> 맞음</label><label class="choice"><input type="radio" name="choice" value="wrong"> 상이</label><label class="choice"><input type="radio" name="choice" value="undecidable"> 판단불가</label></fieldset><label for="note"><strong>사유</strong> <span class="muted">상이·판단불가는 필수</span></label><textarea id="note" maxlength="4000" placeholder="무엇이 다르거나 확인되지 않는지 적어 줘"></textarea>
<div class="actions"><label><input type="checkbox" id="auto-next" checked> 저장 후 다음 미판정</label></div><div class="nav"><button id="prev">이전</button><button id="save" class="primary">판정 저장</button><button id="next">다음</button></div><p id="status" class="status" role="status" aria-live="polite"></p></div></section></main>
<script>
"use strict";
const $=id=>document.getElementById(id),state={cases:[],votes:{},drafts:{},current:null,busy:false,draftKey:null};
const navigationHistory=[]; // Author: chatggpt_gpt6_extrahigh
const preview={row:null,page:1,count:0,hits:[],timer:null};
const labels={correct:"맞음",wrong:"상이",undecidable:"판단불가"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=x=>x==null||x===""?"(없음)":typeof x==="string"?x:JSON.stringify(x,null,2);
function setStatus(s,k=""){ $("status").textContent=s;$("status").className="status "+k }
function cacheDraft(){if(!state.current)return;state.drafts[state.current]={choice:document.querySelector('[name=choice]:checked')?.value||"",note:$('note').value};try{localStorage.setItem(state.draftKey,JSON.stringify(state.drafts))}catch{}}
function scopedRows(){let f=$('filter').value,a=state.cases;if(f==="priority")return a.filter(c=>c.priority);if(f==="auto_needed")return a.filter(c=>c.priority&&c.automatic?.status!=="correct"&&!state.votes[String(c.excel_row)]);if(f==="auto_correct")return a.filter(c=>c.automatic?.status==="correct");if(f==="saved")return a.filter(c=>state.votes[String(c.excel_row)]).sort((x,y)=>String(state.votes[String(y.excel_row)].updated_at_utc||'').localeCompare(String(state.votes[String(x.excel_row)].updated_at_utc||'')));if(f==="pending")return a.filter(c=>!state.votes[String(c.excel_row)]);if(labels[f])return a.filter(c=>state.votes[String(c.excel_row)]?.choice===f);return a}
// Author: chatggpt_gpt6_extrahigh. Search display keys only; source labels remain unchanged.
function filterListSearch(rows,query){
 const q=String(query||'').normalize('NFKC').trim();if(!q)return rows;
 if(/^#?\d+(?:[\s,，、]+#?\d+)*$/.test(q)){const ids=new Set(q.replace(/#/g,'').split(/[\s,，、]+/).map(Number));return rows.filter(c=>ids.has(Number(c.excel_row)));}
 const key=s=>String(s||'').normalize('NFKC').toLocaleLowerCase().replace(/\s/g,'');
 const terms=q.split(/\s+/).filter(Boolean).map(key);
 return rows.filter(c=>terms.every(t=>key(c.excel_name).includes(t)||key(c.agency).includes(t)||String(c.excel_row)===t));
}
function visible(){return $('filter').value==='search'?filterListSearch(scopedRows(),$('list-search').value):scopedRows()}
function renderList(){let root=$('list');root.replaceChildren();const searching=$('filter').value==='search';$('list-search').hidden=!searching;const filtered=visible();$('list-search-count').textContent=`현재 목록 ${filtered.length} / ${scopedRows().length}행`+(state.current&&!filtered.some(c=>String(c.excel_row)===state.current)?` · 열람 중인 ${state.current}행은 목록 밖`:'');if(!filtered.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='검색 결과 없음 · 목록 필터를 전체로 바꾸거나 검색어를 지워줘.';root.append(empty);}let done=Object.keys(state.votes).length;$('progress').textContent=`${done}/${state.cases.length}행 저장`;for(const c of visible()){let id=String(c.excel_row),b=document.createElement('button');b.className='case'+(id===state.current?' active':'');b.disabled=state.busy;let tags=(c.priority_labels||[]).map(x=>x==='semantic_review'?'의미 검토':x==='exact_sample_wrong'?'표본 상이':'').filter(Boolean).join(' · ');b.innerHTML=`<b>${esc(c.excel_row)}행 · ${esc(c.excel_name)}</b><small>${esc(c.agency)} · ${c.automatic?.status==='correct'?'자동 맞음 · ':''}${state.votes[id]?esc(labels[state.votes[id].choice]):c.priority?`우선 · ${esc(tags)}`:'미판정'}</small>`;b.onclick=()=>show(id);root.append(b)}}
function candidate(item,index,label){return `<div class="candidate"><div class="name">${esc(item.raw_name||'(이름 없음)')} ${item.budget_code?`<span class="badge">코드 ${esc(item.budget_code)}</span>`:''}</div><p class="muted">${esc(label)}${item.task_id?` · ${esc(item.task_id)}`:''}${item.candidate_index!=null?` · 후보 ${esc(item.candidate_index)}`:''}</p><div class="anchor"><b>원문 위치</b><br>${esc(item.source_path||'')}<br>${item.archive_member?`ZIP 내부: ${esc(item.archive_member)}<br>`:''}${esc(item.anchor||'앵커 없음')}</div></div>`}
function renderEvidence(evidence){
  const entries=Array.isArray(evidence)?evidence:evidence&&typeof evidence==='object'?[evidence]:[];
  if(!entries.length)return '<p class="muted">표시할 근거가 없습니다.</p>';
  return entries.map((entry,i)=>{
    if(!entry||typeof entry!=='object')return `<div class="evidence-card"><b>근거 ${i+1}</b><p>${esc(entry)}</p></div>`;
    const location=entry.source_anchor||entry.anchor||[entry.source_path,entry.archive_member].filter(Boolean).join(' · ');
    const source=entry.type==='workbook'?'검수 대상':entry.type==='source'?'원본 자료':'근거';
    const row=entry.row?` · ${esc(entry.row)}행`:'';
    const sheet=entry.sheet?` · ${esc(entry.sheet)} 시트`:'';
    return `<div class="evidence-card"><b>${esc(source)} ${i+1}${sheet}${row}</b>${entry.excerpt?`<blockquote>${esc(entry.excerpt)}</blockquote>`:''}${entry.relevance?`<p class="why"><span class="label">이 근거가 중요한 이유</span><br>${esc(entry.relevance)}</p>`:''}${location?`<p class="where"><span class="label">원문 위치</span><br>${esc(location)}</p>`:''}</div>`;
  }).join('');
}
function updatePreview(){
  $('page-label').textContent=preview.count?`${preview.page} / ${preview.count}쪽`:'준비 중';
  $('prev-page').disabled=preview.page<=1;$('next-page').disabled=preview.page>=preview.count;
  const i=preview.hits.indexOf(preview.page);
  $('prev-hit').disabled=!preview.hits.some(p=>p<preview.page);
  $('next-hit').disabled=!preview.hits.some(p=>p>preview.page);
  if(preview.count){$('source-image').hidden=false;$('source-image').src=`/api/source-page?row=${encodeURIComponent(preview.row)}&page=${preview.page}`;
    $('preview-message').textContent=preview.hits.length?`항목명이 있는 페이지 ${preview.hits.length}곳 · 항목명 버튼으로 이동`:'항목명 자동 검색 위치 없음 · 쪽 버튼으로 직접 확인';}
}
async function loadPreview(row){
  clearTimeout(preview.timer);preview.row=row;preview.page=1;preview.count=0;preview.hits=[];
  $('source-image').hidden=true;$('source-image').removeAttribute('src');$('preview-message').textContent='원본 화면을 준비하는 중…';updatePreview();
  try{const response=await fetch(`/api/source-preview?row=${encodeURIComponent(row)}`);const data=await response.json();
    if(preview.row!==row)return;
    if(!response.ok)throw Error(data.error||'원문을 열지 못했습니다');
    if(data.status==='working'){$('preview-message').textContent='HWP 원본을 PDF 화면으로 변환 중…';preview.timer=setTimeout(()=>loadPreview(row),2500);return}
    if(data.status==='error')throw Error(data.message||'원문 변환 실패');
    preview.count=data.page_count;preview.hits=data.hits||[];preview.page=data.suggested_page||1;updatePreview();
  }catch(error){if(preview.row===row)$('preview-message').textContent=error.message}
}
window.loadPreview=loadPreview;window.addEventListener("source-case-change",event=>loadPreview(event.detail.row));
function renderReferenceFields(fields){
 const root=$('reference-fields');root.replaceChildren();
 for(const field of fields||[]){
  const item=document.createElement('span');
  const value=field.value===null||field.value===undefined||field.value===''?'미기재':typeof field.value==='number'?new Intl.NumberFormat('ko-KR',{maximumFractionDigits:20}).format(field.value):String(field.value);
  item.textContent=`${field.label}: ${value}${field.value!==null&&field.value!==undefined&&field.value!==''&&field.unit?' '+field.unit:''}`;

const ad=c.adjudication,adPanel=$('adjudication');if(c.priority_labels?.includes('semantic_review')&&ad){const original=ad.stage2_source_review||{},audit=ad.adversarial_review||null,eff=ad.effective_silver_verdict;adPanel.innerHTML=`<h3>의미 검토 재판정 참고 (투표 아님)</h3><div class="audit"><b>원래 판정: ${esc(original.verdict||'(기록 없음)')}</b>${original.reason?`<p>${esc(original.reason)}</p>`:''}${original.evidence?`<details><summary>원래 근거·앵커</summary><pre class="text">${esc(pretty(original.evidence))}</pre></details>`:''}</div><div class="audit"><b>적대적 재판정 ${audit?`(${esc(audit.audit||'A/B')})`:'(없음)'}</b>${audit?`<p>재검토 전: ${esc(audit.original_verdict||original.verdict||'기록 없음')} → A/B 판정: <b>${esc(audit.adjudicated_verdict||'기록 없음')}</b></p>${audit.adjudicated_issue?`<p>${esc(audit.adjudicated_issue)}</p>`:''}${audit.independently_reviewed_original_anchor?`<p><b>독립 확인한 원문 앵커:</b> ${esc(pretty(audit.independently_reviewed_original_anchor))}</p>`:''}${audit.original_source_claims?`<details><summary>기존 원문 주장</summary><pre class="text">${esc(pretty(audit.original_source_claims))}</pre></details>`:''}${audit.limitations?`<p class="muted"><b>한계:</b> ${esc(pretty(audit.limitations))}</p>`:''}`:'<p class="muted">이 행에는 A/B 재판정 기록이 없습니다.</p>'}</div><div class="effective"><b>최종 effective_silver_verdict · 참고 정보</b><div><strong>${esc(eff||'기록 없음')}</strong></div>${eff==='undecidable'?'<p>근거 부족으로 판단불가입니다. 이 참고 판정은 사람 투표를 자동으로 “맞음”으로 설정하지 않습니다.</p>':'<p>실버셋 참고 판정이며 사람의 최종 투표를 대신하지 않습니다.</p>'}</div>`}else{adPanel.replaceChildren()}

function previousTarget(current,rows,visited,votes){

 const i=rows.findIndex(c=>String(c.excel_row)===current);if(i>0)return String(rows[i-1].excel_row);
 return Object.keys(votes).filter(id=>id!==current).sort((a,b)=>String(votes[b].updated_at_utc||'').localeCompare(String(votes[a].updated_at_utc||'')))[0]||null;
}
function move(offset){
 if(state.busy)return;
 if($('filter').value==='search'){const rows=visible(),index=rows.findIndex(c=>String(c.excel_row)===state.current),target=rows[index+offset];if(target)show(String(target.excel_row));else setStatus(offset<0?'현재 목록의 첫 행입니다.':'현재 목록의 마지막 행입니다.');return;}
 if(offset<0){const target=previousTarget(state.current,visible(),navigationHistory,state.votes);if(target){const i=navigationHistory.lastIndexOf(target);if(i>=0)navigationHistory.splice(i);if(!visible().some(c=>String(c.excel_row)===target))$('filter').value=state.votes[target]?'saved':'all';show(target,false);}else setStatus('이전 검토 행이 없습니다.');return;}
 const a=visible(),i=a.findIndex(c=>String(c.excel_row)===state.current),c=a[i+offset];if(c)show(String(c.excel_row));else setStatus('현재 목록의 마지막 행입니다.');
}
function busy(v){state.busy=v;document.querySelectorAll('[name=choice],#note,#save,#prev,#next,#filter,#list-search').forEach(x=>x.disabled=v);renderList()}
async function save(){cacheDraft();let d=state.drafts[state.current];if(!d?.choice)return setStatus('판정을 선택하세요.','error');if(d.choice!=='correct'&&!d.note.trim())return setStatus('상이·판단불가 사유를 적어주세요.','error');busy(true);try{let r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({excel_row:Number(state.current),...d})}),data=await r.json();if(!r.ok)throw Error(data.error||'저장 실패');state.votes[state.current]=data.vote;delete state.drafts[state.current];localStorage.setItem(state.draftKey,JSON.stringify(state.drafts));busy(false);setStatus('로컬 JSON에 저장했습니다.','ok');if($('auto-next').checked){let scope=visible(),c=$('filter').value==='search'?scope[scope.findIndex(x=>String(x.excel_row)===state.current)+1]:scope.find(x=>!state.votes[String(x.excel_row)]&&x.automatic?.status!=='correct');if(c)show(String(c.excel_row));else setStatus('현재 범위의 미판정 행을 모두 저장했습니다.','ok')}}catch(e){busy(false);setStatus(e.message,'error')}}

(async()=>{try{let r=await fetch('/api/cases'),data=await r.json();if(!r.ok)throw Error(data.error);document.querySelector("h1").textContent=data.dataset_title;document.querySelector("header p").textContent=data.question||"항목과 원본 근거를 대조해 주세요";document.querySelector(".vote-body > p").textContent=data.question||"항목과 원본 근거가 일치하나요?";state.cases=data.cases.map(c=>({...c,automatic:data.automatic?.[String(c.excel_row)]}));state.votes=data.votes;if(data.automatic&&Object.keys(data.automatic).length){$('filter').querySelector('[value="auto_correct"]').textContent=`자동 맞음 ${state.cases.filter(c=>c.automatic?.status==='correct').length}행`;$('filter').querySelector('[value="auto_needed"]').textContent=`검토 필요 ${state.cases.filter(c=>c.priority&&c.automatic?.status!=='correct'&&!state.votes[String(c.excel_row)]).length}행 · 우선 검토 중`;if(new URLSearchParams(location.search).get('auto')==='1')$('filter').value='auto_needed';}state.inputSha=data.input_sha256;state.matchSha=data.match_sha256;state.manifestSha=data.manifest_sha256;state.semanticSha=data.semantic_manifest_sha256;state.exactSampleManifestSha=data.exact_sample_manifest_sha256;state.exactSampleResultsSha=data.exact_sample_results_sha256;state.adjudicatedSha=data.adjudicated_sha256;state.workbookSha=data.workbook_sha256;$('filter').querySelector('[value="priority"]').text=`우선 검토 ${data.cases.filter(c=>c.priority).length}행`;const listParams=new URLSearchParams(location.search),legacyQuery=listParams.get('review');if(listParams.get('mode')==='search'||legacyQuery){$('filter').value='search';$('list-search').value=listParams.get('q')||legacyQuery||'';}state.draftKey='studio-record-review:'+state.inputSha;try{let cached=JSON.parse(localStorage.getItem(state.draftKey)||'{}');for(const [id,d] of Object.entries(cached))if(state.cases.some(c=>String(c.excel_row)===id)&&typeof d?.note==='string'&&(!d.choice||labels[d.choice]))state.drafts[id]=d}catch{}let hash=decodeURIComponent(location.hash.slice(1)),first=state.cases.some(c=>String
