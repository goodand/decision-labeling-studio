<!doctype html><html lang="ko"><meta charset="utf-8"><title>교차검증 충돌 검수</title><link rel="stylesheet" href="/legacy.css"><link rel="stylesheet" href="/pdf-source-viewer.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#182b3b;font:15px system-ui}header{padding:16px 22px;background:white;border-bottom:1px solid #ddd;display:flex;gap:18px;align-items:center}h1{font-size:18px;margin:0}main{display:grid;grid-template-columns:230px minmax(400px,1fr) 330px;height:calc(100vh - 70px);gap:12px;padding:12px}aside,section{background:white;border:1px solid #dae1e8;border-radius:10px;padding:14px;overflow:auto}body.collapsed main{grid-template-columns:minmax(400px,1fr) 330px}body.collapsed #list{display:none}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #bccbd7;border-radius:6px}button{cursor:pointer;background:white}button:disabled{opacity:.5}button.primary{background:#1856a5;color:white}#items button{display:block;width:100%;text-align:left;margin:7px 0;font-size:13px}#items button.active{border:2px solid #1856a5;background:#edf5ff}#filter,#query{width:100%;margin-bottom:8px}#pair{font-size:17px;line-height:1.5;margin-bottom:12px}#editor label{display:block;margin-top:14px}#editor input,#editor select,#editor textarea{width:100%;margin-top:5px}blockquote{margin:12px 0;padding:12px;background:#f2f6fb;line-height:1.7;white-space:pre-wrap}#editor textarea{height:90px}#status{font-size:13px;color:#315b41}#editor .actions{display:flex;gap:8px;margin-top:16px}.preview-viewport.native-scroll{height:calc(100vh - 345px);min-height:300px}#native-search{position:sticky;top:0;background:white;z-index:8;padding:8px 0}#agency{font-size:12px;overflow-wrap:anywhere}#excel{display:none}.muted{font-size:12px;color:#647589}#preview-message{font-size:11px}#source-select{max-width:100%;width:100%;font-size:12px} @media(max-width:1000px){main{grid-template-columns:170px minmax(320px,1fr) 270px}}
#markjump{margin-left:10px}#open-file,#open-dir{margin-left:10px}#open-status{font-size:12px;color:#315b41;margin-left:8px}#open-status.bad{color:#b42318;font-weight:600}#source-select{display:block;margin-bottom:10px}html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column}header{flex-shrink:0}main{flex:1;min-height:0;height:auto}aside,section{min-height:0;overscroll-behavior-y:contain;overflow-anchor:none}.preview-viewport{overscroll-behavior:contain;overflow-anchor:none}#native-page{flex-shrink:0;margin:0 auto}#editor textarea{resize:vertical;overscroll-behavior:contain}#editor .actions{flex-wrap:wrap}.audit-card{cursor:pointer}.audit-card.on{outline:2px solid #f08a24}.locate-status{display:block;color:#2f6b3a;font-size:12px}.locate-status.bad{color:#b42318;font-weight:600}.audit-card{margin:14px 0;padding:12px;background:#f5f8fc;border:1px solid #dce5ef;border-radius:8px}.audit-card blockquote{margin:8px 0;padding:0;background:none;font-size:14px}.audit-card details{font-size:12px;overflow-wrap:anywhere}.audit-card summary{cursor:pointer;color:#48617b}#pending{font-size:14px;line-height:1.6;background:#fff3df;padding:10px;margin-top:10px}@media(max-width:760px){html,body{height:auto;overflow:auto}header{flex-wrap:wrap;gap:8px;padding:12px}header h1{flex:1;min-width:150px}main,body.collapsed main{display:flex;flex-direction:column;padding:8px;overflow:visible}#list{max-height:180px;order:0}#editor{order:1}main>section{order:2}.preview-viewport.native-scroll{height:450px;min-height:280px}aside,section{overflow:visible}#items{max-height:90px;overflow:auto}#source-select{min-width:0}header button,header a{font-size:13px}}</style><header><button id="toggle">☰ 목록</button><h1>교차검증 충돌 검수</h1><span id="progress"></span><button id="review-saved">저장한 판정 수정</button><a href="/api/votes" target="_blank">저장 JSON</a></header><main><aside id="list"><input id="query" placeholder="사업명·번호 검색"><select id="filter"><option value="all">전체</option><option value="todo">미검수</option><option value="done">저장됨</option></select><div id="items"></div></aside><section><div id="pair"></div><div id="excel"></div><div id="agency"></div><select id="source-select"></select><button id="jump">판정 근거 찾기</button><button id="markjump">진단표 찾기</button> <button id="open-file" type="button" title="한컴 등 기본 프로그램으로 원본 파일을 연다">원본 열기</button><button id="open-dir" type="button" hidden title="원본 파일을 열 수 없을 때 파일이 있던 폴더를 연다">폴더 열기</button><span id="open-status" role="status"></span><span id="summary-value" role="status" style="display:inline-block;margin:8px 0 8px 12px;padding:7px 10px;background:#edf3fb;border-radius:6px;font-size:13px"></span><div class="preview-head"><h3>원본 문서 화면 <span id="viewer-mode" class="badge">rhwp 초기화 대기</span></h3><div class="preview-controls" id="native-controls" hidden><button id="native-prev-hit" title="사업명이 있는 이전 페이지">◀ 사업명</button><span id="native-page-label">준비 중</span><button id="native-next-hit" title="사업명이 있는 다음 페이지">사업명 ▶</button></div><div class="preview-controls" id="pdf-controls"><button id="prev-hit" title="사업명이 있는 이전 페이지">◀ 사업명</button><button id="prev-page" title="바로 이전 페이지">◀ 페이지</button><span id="page-label">준비 중</span><button id="next-page" title="바로 다음 페이지">페이지 ▶</button><button id="next-hit" title="사업명이 있는 다음 페이지">사업명 ▶</button></div></div><div id="native-search" hidden><label for="native-search-input">원문 찾기</label><input id="native-search-input" type="search" placeholder="원문에서 찾을 말" autocomplete="off"><button id="native-search-prev" title="이전 검색 결과">↑</button><button id="native-search-next" title="다음 검색 결과">↓</button><span id="native-search-count" role="status">Ctrl+F로 검색</span></div><div id="preview-message" class="muted"></div><div class="preview-viewport"><div id="native-page" tabindex="0" aria-label="원본 문서" hidden></div><img id="source-image" alt="원본 예산서 페이지" hidden></div><div id="object-panel" hidden></div><p id="viewer-error" class="error" hidden></p></section><aside id="editor"><strong>원문 근거로 판정을 선택해 주세요</strong><div id="pending" class="muted"></div><div id="audit-cards"></div><label>신규 사업명<input id="subject"></label><label>비교 사업명<input id="comparison"></label><label>자료의 판정<select id="label"><option value="">선택하세요</option><option>유사중복 있음</option><option>유사중복 없음</option><option>판단불가</option></select></label><label>판정 범위 · 원문 인용<textarea id="scope" placeholder="판정을 뒷받침하는 원문을 입력하세요"></textarea></label><blockquote id="quote"></blockquote><label>검수 결과<select id="choice"><option value="">선택하세요</option><option value="accurate">판정 확정</option><option value="corrected">사업명·범위 수정 후 확정</option><option value="uncertain">판단불가</option></select></label><label>메모 / 판단불가 사유<textarea id="note"></textarea></label><div class="actions"><button id="prev">이전</button><button id="save-stay">수정 저장</button><button id="save" class="primary">저장 후 다음</button><button id="next">다음</button></div><p id="status" role="status"></p></aside></main><script type="module" src="/app.js"></script></html>
