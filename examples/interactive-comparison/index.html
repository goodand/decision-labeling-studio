<!doctype html><html lang="ko"><meta charset="utf-8"><title>DDS 격리 비교</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f5f5f5;color:#111}header{padding:14px 18px;background:#fff;border-bottom:1px solid #ddd}h1{font-size:20px;margin:0 0 8px}p{margin:5px 0}select,button{font:inherit;padding:7px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:10px 18px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px 12px}section{background:white;border:1px solid #bbb}h2{font-size:14px;margin:0;padding:9px;border-bottom:1px solid #ddd}iframe{display:block;width:100%;height:650px;border:0;background:#fff}footer{padding:8px 18px}a{color:#0969da}@media(max-width:1000px){main{grid-template-columns:1fr}iframe{height:600px}}</style>
<header><h1>실제 도식 A/B 조작 비교</h1><p>같은 입력의 두 과거 DDS 스냅샷입니다. 각 도식 안에서 직접 접기·펼치기·Hover를 사용하고, 양쪽 펼치기·접기 및 좌우 교환을 비교하세요.</p><p>제품 최신 버전이나 후보 우위에 대한 승인을 의미하지 않습니다. 검수 UI 재사용을 위한 보존 예제입니다.</p></header>
<nav><label>내용 <select id="case"><option value="r92-same-input">v3.92 원본 동일 입력</option></select></label><label>왼쪽 <select id="left"><option>R92</option><option>D0</option></select></label><label>오른쪽 <select id="right"><option>D0</option><option>R92</option></select></label><button id="expand">양쪽 모두 펼치기</button><button id="collapse">양쪽 모두 접기</button><button id="swap">좌우 바꾸기</button><button id="reload">다시 열기</button></nav>
<main><section><h2 id="title-left"></h2><iframe id="frame-left" title="왼쪽 diagram"></iframe></section><section><h2 id="title-right"></h2><iframe id="frame-right" title="오른쪽 diagram"></iframe></section></main>
<footer><a href="../../README.md">사용법과 출처</a><p id="notice">양쪽 도식을 직접 조작하세요.</p></footer>
<script>const labels={R92:'보존 v3.92',D0:'당시 비교 DDS 스냅샷',D1:'DDS + ELK geometry',D2:'G6 + 동일 D0 geometry'};function update(){const c=document.getElementById('case').value;for(const side of ['left','right']){const a=document.getElementById(side).value;document.getElementById('title-'+side).textContent=a+' · '+labels[a]+' · '+c;document.getElementById('frame-'+side).src=a==='R92'&&c!=='r92-same-input'?'artifacts/R92/unavailable.html':'artifacts/'+a+'/'+c+'.html';}document.getElementById('notice').textContent=c==='linked'?'linked demo의 simulated approval은 real 승인으로 승격하지 않습니다. expanded internal detail의 외곽/제목 없음, 한 번 펼침, 공유 Hover를 비교하세요.':c==='complex-core'?'실제 Core 입력이지만 현재 버전 Human 승인기록은 확인되지 않았습니다. topology/표현 비교와 approval claim을 구분합니다.':'동일 v3.92 원본 Full의 화면/조작을 비교합니다. 이후 source로 생성한 D0/D1/D2를 v3.92라고 부르지 않습니다.';}function command(action){for(const s of ['left','right'])document.getElementById('frame-'+s).contentWindow.postMessage({type:'dds-comparison',action},'*');}for(const id of ['case','left','right'])document.getElementById(id).onchange=update;document.getElementById('reload').onclick=update;document.getElementById('expand').onclick=()=>command('expandAll');document.getElementById('collapse').onclick=()=>command('collapseAll');document.getElementById('swap').onclick=()=>{const l=document.getElementById('left'),r=document.getElementById('right'),v=l.value;l.value=r.value;r.value=v;update();};update();</script></html>
