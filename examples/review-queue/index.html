<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DDS 미검증 화면 검수</title><style>
*{box-sizing:border-box}body{font:16px system-ui;margin:18px;color:#172033;background:#f5f6f8}button,select{font:inherit;padding:9px}header{display:flex;gap:8px;flex-wrap:wrap}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:16px}.viewport{height:74vh;overflow:auto;background:white;border:1px solid #bbb}img{display:block;max-width:none}iframe{width:100%;height:100%;border:0}aside{background:white;padding:16px}label{display:block;margin:16px 0}textarea{width:100%;height:110px;font:inherit}#title{font-size:20px}small{display:block;margin:10px 0}@media(max-width:850px){main{display:block}}</style>
<h1>DDS 시각 품질 · 부분 펼침 Hover 검수</h1><p>기존 승인 사례를 silverset 참고 기준으로 삼아 선정한 4개입니다. 모두 실제 Full입니다. 클릭·Hover·접기·펼치기·100%·스크롤을 직접 사용하세요. 의미의 타당성이나 이해 달성은 개발 판정 대상에 포함하지 않습니다.</p>
<header><select id="filter"><option value="live">실제 조작 · 선정 4사례</option></select><select id="case"></select><button id="prev">이전</button><button id="next">다음</button><span id="progress"></span></header>
<main><section><h2 id="title"></h2><button id="actual" hidden>이미지 100%</button> <button id="fit" hidden>이미지 너비 맞춤</button> <a id="original" target="_blank">원본 별도 열기</a><div class="viewport"><img id="image"><iframe id="live" title="실제 Full 조작"></iframe></div></section><aside><h3>확인할 것</h3><p id="criterion"></p><label><input type="radio" name="verdict" value="PASS">PASS</label><label><input type="radio" name="verdict" value="FAIL">FAIL</label><label><input type="radio" name="verdict" value="UNREVIEWED">판단 보류</label><textarea id="comment" placeholder="문제 위치·상태 또는 조건을 적어 주세요"></textarea><button id="save">전체 판정 JSON 저장</button><p id="status"></p><small>기존 dds-context-review/v1 형식을 사용합니다. 파일명은 자동 지정됩니다. 입력은 브라우저 초안이며 채팅으로 자동 전송되지 않습니다. 조작 화면은 직접 클릭·Hover할 수 있습니다.</small></aside></main>
<script>const cases=[{"id": "pair-diamond-then-diamond-expanded-live", "title": "복잡 1 · Diamond + Diamond · 모두 펼침", "kind": "live", "url": "pair-diamond-then-diamond-expanded.html", "source": "pair-diamond-then-diamond-expanded.html", "sha256": "2d3aafbf2545f8da7cea1e11142ea53b7f7fd751e12fc3a56a2e58ad174ff959", "criterion": "두 분기·합류가 연속됩니다. 각 분기의 선·화살촉과 중간 경계를 구별할 수 있나요? 내부 노드와 공유 경계에 Hover해 강조 범위도 확인해 주세요."}, {"id": "pair-cycle-then-cycle-expanded-live", "title": "복잡 2 · Cycle + Cycle · 모두 펼침", "kind": "live", "url": "pair-cycle-then-cycle-expanded.html", "source": "pair-cycle-then-cycle-expanded.html", "sha256": "7c4be6ac99dc717f9dbb66faaf40845a4a60afa3d89af4aaa2ecd58d2e600ac7", "criterion": "두 반복선과 긴 세로 흐름이 함께 있습니다. 100%와 스크롤을 사용해 문구·반복 방향·화살촉을 읽을 수 있나요? 내부 노드와 경계에 Hover해 보세요."}, {"id": "hover-pair-diamond-then-cycle-task-a", "title": "애매 1 · Diamond 펼침 + Cycle 접힘", "kind": "live", "url": "pair-diamond-then-cycle-task-a.html", "source": "pair-diamond-then-cycle-task-a.html", "sha256": "b87c0a2376078747774d92c84ab1430ac64978d2332c02b3ffa4e86b6642a0c4", "criterion": "병합에 들어오는 측면 화살촉 앞 선이 짧게 보입니다. 방향을 구별하기 충분한가요? 공유 경계 Hover와 내부 노드 Hover의 강조 차이도 확인해 주세요."}, {"id": "hover-pair-cycle-then-diamond-task-a", "title": "애매 2 · Cycle 펼침 + Diamond 접힘", "kind": "live", "url": "pair-cycle-then-diamond-task-a.html", "source": "pair-cycle-then-diamond-task-a.html", "sha256": "cf1ca7434e0b264c740b29f9446076603feea7a6894003565d8b67f7c520b44e", "criterion": "생성 노드에 들어오는 반복선의 종단이 짧게 보입니다. 선과 화살촉이 구별되나요? 반복 내부와 공유 경계에 Hover했을 때 연결을 읽기 충분한가요."}];const $=id=>document.getElementById(id),key='dds-pending-human-review-selected-four-20261016';let answers={};try{answers=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let current=null;let mode='original-size';
function persist(){if(!current)return;answers[current.id]={verdict:document.querySelector('[name=verdict]:checked')?.value||'UNREVIEWED',comment:$('comment').value,displayMode:mode};try{localStorage.setItem(key,JSON.stringify(answers));$('status').textContent='브라우저 초안 저장됨'}catch{$('status').textContent='JSON 저장을 사용해 주세요'}}
function show(){current=cases.find(c=>c.id===$('case').value);$('title').textContent=current.title;$('criterion').textContent=current.criterion;$('original').href=current.url;$('image').hidden=current.kind!=='image';$('live').hidden=current.kind!=='live';if(current.kind==='image'){$('live').src='about:blank';$('image').src=current.url}else{$('live').src=current.url}document.querySelectorAll('[name=verdict]').forEach(r=>r.checked=r.value===answers[current.id]?.verdict);$('comment').value=answers[current.id]?.comment||'';$('status').textContent=answers[current.id]?.verdict||'미검수';$('progress').textContent=($('case').selectedIndex+1)+' / '+$('case').options.length;}
function populate(){persist();$('case').replaceChildren(...cases.filter(c=>c.kind===$('filter').value).map(c=>new Option(c.title,c.id)));show()}
$('filter').onchange=populate;$('case').onchange=()=>{persist();show()};for(const [id,delta] of [['prev',-1],['next',1]])$(id).onclick=()=>{persist();$('case').selectedIndex=($('case').selectedIndex+delta+$('case').options.length)%$('case').options.length;show()};document.querySelectorAll('[name=verdict]').forEach(r=>r.onchange=persist);$('comment').oninput=persist;$('actual').onclick=()=>{mode='original-size';$('image').style.width='auto';persist()};$('fit').onclick=()=>{mode='fit-width';$('image').style.width='100%';persist()};
$('save').onclick=()=>{persist();const result={schema:'dds-context-review/v1',reviewer:'Human',recordedAt:new Date().toISOString(),source:location.href,viewport:{width:innerWidth,height:innerHeight,devicePixelRatio},displayWidth:$('image').getBoundingClientRect().width,cases:cases.map(c=>({...c,...(answers[c.id]||{verdict:'UNREVIEWED',comment:''})}))};const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='dds-selected-four-20261016-human-response.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('status').textContent='JSON保存 요청됨'.replace('保存','저장');};populate();</script></html>
